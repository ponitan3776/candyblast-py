services:
  # ===== バックエンド (Flask API) =====
  - type: web
    name: pinkyburst
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 1 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DISCORD_WEBHOOK_AUTH
        sync: false
      - key: DISCORD_WEBHOOK_LOGIN
        sync: false
      - key: DISCORD_WEBHOOK_FEATURE_REQUEST
        sync: false
      - key: DISCORD_WEBHOOK_BUG_REPORT
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

  # ===== フロントエンド (静的サイト) =====
  - type: web
    name: candyblast-py
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
